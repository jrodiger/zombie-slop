name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2
        run: |
          curl -fL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Check source and transactional logic without asset packs
        run: python3 scripts/test_source.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      # No assets, imported resources, playable builds or screenshots are uploaded.
